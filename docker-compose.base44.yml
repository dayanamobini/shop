services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - node_modules:/workspace/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
