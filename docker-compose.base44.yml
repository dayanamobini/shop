# Development environment for Base44.
# Runs the Vite dev server straight from the bind-mounted clone so edits
# hot-reload; nothing here bakes a production bundle.
services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Dependencies live in the container, so host/OS-specific bins never leak in.
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Platform-provided; Vite >= 6.1 appends this to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Passed through so app code can detect the sandbox (never hardcoded).
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: deva
      base44.kind: web
      base44.port: "3000"

volumes:
  node_modules:
